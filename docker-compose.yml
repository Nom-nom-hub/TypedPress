services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: typedpress
      POSTGRES_PASSWORD: typedpress
      POSTGRES_DB: typedpress
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U typedpress -d typedpress']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
